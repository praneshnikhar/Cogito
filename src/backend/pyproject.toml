[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cogito"
version = "0.1.0"
description = "MongoDB-native RAG knowledge assistant (MCP-powered)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.5",
    "pymongo>=4.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.40",
    "langchain-text-splitters>=0.2.2",
    "langgraph>=0.2.9",
    "posthog>=3.5",
    "sentry-sdk[fastapi]>=2.8",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "supabase>=2.6",
    "mcp>=1.9,<2",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]